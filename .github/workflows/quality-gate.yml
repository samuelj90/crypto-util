name: Engineering Quality Gate & Code Standards

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  quality-gate:
    name: Code Standards, Linting & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Commit Author Standardization
        run: |
          echo "Verifying commit metadata..."
          git log -n 5 --format="Commit %h by %an <%ae>"
          # Ensure commits are authored by verified email
          INVALID_COMMITS=$(git log -n 1 --format="%ae" | grep -v -E "(samuelj90@gmail.com|users.noreply.github.com|dependabot)" || true)
          if [ -n "$INVALID_COMMITS" ]; then
            echo "⚠️ Notice: Commit author email $INVALID_COMMITS differs from primary engineering email."
          fi

      - name: Secret & Credential Leak Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
